<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <h1>DM settings</h1>
      <p class="muted">
        Downloads are sent to the DM daemon through a Native Messaging host. No
        port or token is configured here: the host reads the daemon's runtime
        endpoint and token file itself.
      </p>
      <form id="form">
        <label class="check">
          <input id="enabled" type="checkbox" />
          Capture browser downloads with DM
        </label>

        <label>Minimum file size to capture (bytes, 0 = all)</label>
        <input id="minSize" type="number" min="0" placeholder="0" />

        <label>Allow hosts (comma-separated, empty = allow all)</label>
        <input id="allowHosts" type="text" placeholder="example.com, dl.example.org" />

        <label>Deny hosts (comma-separated, empty = deny none)</label>
        <input id="denyHosts" type="text" placeholder="tracker.example.com" />

        <div class="row">
          <button type="submit">Save</button>
          <button type="button" id="test">Test connection</button>
          <button type="button" id="clear">Clear</button>
        </div>
      </form>
      <div id="status" class="status"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
