<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>DM</h1>
      <p class="muted">Send a link to the DM desktop review dialog.</p>
      <form id="form">
        <label>URL</label>
        <input id="url" type="url" placeholder="https://example.com/file.iso" required />
        <div class="row">
          <button type="submit" id="send">Review in DM</button>
          <button type="button" id="openOptions">Settings</button>
        </div>
      </form>
      <div id="status" class="status"></div>
      <p id="hostStatus" class="muted small"></p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
