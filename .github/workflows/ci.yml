name: ci

on:
  push:
    branches: [main, master, architecture/native-gtk4]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package.json
            internal/gui/wails/frontend/package.json

      - name: Build embedded web UI
        working-directory: ui
        run: |
          npm install --no-package-lock
          npm run build

      - name: Build Wails UI
        working-directory: internal/gui/wails/frontend
        run: |
          npm install --no-package-lock
          npm run build

      - name: Verify
        run: ./scripts/check.sh
