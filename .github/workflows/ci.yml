name: ci

on:
  push:
    branches:
      - main
      - architecture/native-gtk4
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format, vet, race tests, and build
        run: ./scripts/check.sh
