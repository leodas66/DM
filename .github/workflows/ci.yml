name: ci

on:
  push:
    branches: [main, architecture/native-gtk4]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Debug gofmt output
        run: gofmt -d desktop/internal/ui/add.go || true

      - name: Format, vet, race tests, and build
        run: ./scripts/check.sh

  extension:
    name: Browser extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Test, lint and build browser targets
        working-directory: extension
        run: |
          npm test
          npm run lint
          npm run build

  desktop:
    name: GTK4 client checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true

      - name: Install GTK4 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgirepository1.0-dev

      - name: Format, vet, race tests, and build
        run: ./scripts/check-desktop.sh
